<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="CSS/style.css">
  <title>Formulário 1</title>
</head>

<body>
  <div class="wrap">

    <h1>CADASTRE-SE</h1>

    <form action="#">

      <div class="faixa">Dados de Login</div>
      <div class="bloco">
        <table>
          <tr>
            <td style="width: 50%;">
              <label for="cpf">CPF <span>(Formato: xxx.xxx.xxx-xx) </span></label>
              <input type="text" id="cpf" name="cpf" placeholder="123.456.789-10" pattern="^\d{3}\.\d{3}\.\d{3}-\d{2$}"
                required>
            </td>
            <td style="width: 50%;">
              <label for="senha">Senha: </label>
              <input type="password" id="senha" name="senha" minlength="6" required>
            </td>
          </tr>

          <tr>
            <td>
              <label for="email">Email: </label>
              <input type="email" id="email" name="email" placeholder="seuemail@gmail.com" required>
            </td>
            <td>
              <label for="email2">Confirmar:</label>
              <input type="email" id="email2" name="email2" placeholder="repita o e-mail" required>
            </td>
            <td></td>
          </tr>
        </table>
      </div>

      <div class="faixa">Dados de Contato</div>
      <div class="bloco">
        <table>
          <tr>
            <td style="width: 50%;">
              <label for="nome">Nome</label>
              <input type="text" id="nome" name="nome" required>
            </td>
            <td style="width: 50%;">
              <label for="sobrenome">Sobrenome</label>
              <input type="text" id="sobrenome" name="sobrenome" required>
            </td>
          </tr>
          <tr>
            <td>
              <label for="nascimento">Nascimento <span>(Formato: xx/xx/xxxx)</span></label>
              <input type="date" id="nascimento" name="nascimento">
            </td>
            <td>
              <label for="sexo">Sexo</label>
              <select id="sexo" name="sexo">
                <option value="">Selecione</option>
                <option>Masculino</option>
                <option>Feminino</option>
                <option>Outro</option>
                <option>Prefiro não informar</option>
              </select>
            </td>
            <td></td>
          </tr>

          <tr>
            <td colspan="2">
              <table style="width: 100%;">
                <tr>
                  <td style="width: 35%;">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" name="cep" placeholder="00000-000" pattern="^\d{5}-?\d{3}$">
                  </td>
                  <td style="width: 44px;">
                    <label>&nbsp;</label>
                    <button type="button" title="Buscar CEP">🔎</button>
                  </td>
                  <td>
                    <label for="endereço">Endereço</label>
                    <input type="text" id="endereco" name="endereco">
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <tr>
            <td>
              <label for="numero">Nº</label>
              <input type="text" id="numero" name="numero">
            </td>
            <td>
              <label for="bairro">Bairro</label>
              <input type="text" id="bairro" name="bairro">
            </td>
          </tr>

          <tr>
            <td>
              <label for="complemento">Complemento</label>
              <input type="text" id="complemento" name="complemento">
            </td>
            <td>
              <label for="cidade">Cidade</label>
              <input type="text" id="cidade" name="cidade">
            </td>
          </tr>

          <tr>
            <td>
              <label for="estado">Estado</label>
              <select name="estado" id="estado">
                <option value="">Selecione</option>
                <option value="">Selecione</option>
                <option>AC</option><option>AL</option><option>AP</option><option>AM</option>
                <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
                <option>GO</option><option>MA</option><option>MT</option><option>MS</option>
                <option>MG</option><option>PA</option><option>PB</option><option>PR</option>
                <option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
                <option>RS</option><option>RO</option><option>RR</option><option>SC</option>
                <option>SP</option><option>SE</option><option>TO</option>
              </select>
            </td>
            <td></td>
          </tr>

          <tr>
            <td>
              <label for="tel">DDD + Telefone</label>
              <input type="tel" id="tel" name="tel" placeholder="(11) 0000-0000">
            </td>
            <td>
              <label for="cel">DDD + Celular</label>
              <input type="tel" id="cel" name="cel" placeholder="(11) 00000-0000">
            </td>
          </tr>
        </table>
      </div>

      <div class="acoes">
        <button type="reset">Limpar</button>
        <button type="submit">Cadastrar</button>
      </div>
    </form>
  </div>
</body>

</html>
