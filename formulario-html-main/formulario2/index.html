<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escola Virtual - Formulário de Pré-Matrícula</title>
</head>
<body>
  <h1>Escola Virtual</h1>
  <h2>Formulário de Pré-Matrícula</h2>
  <hr>

  <form action="#" method="post">
    <!-- DADOS PESSOAIS -->
    <fieldset>
      <legend>Dados Pessoais:</legend>

      <label>Nome do Aluno:</label>
      <input type="text" name="nomeAluno"><br><br>

      <label>Nascimento (dd/mm/aaaa):</label>
      <input type="text" size="2" maxlength="2"> /
      <input type="text" size="2" maxlength="2"> /
      <input type="text" size="4" maxlength="4"><br><br>

      <label>Nome da Mãe:</label>
      <input type="text" name="nomeMae"><br><br>

      <label>Nome do Pai:</label>
      <input type="text" name="nomePai"><br><br>

      <label>Telefone: DDD</label>
      <input type="text" size="2" maxlength="2">
      <label>Tel:</label>
      <input type="text" size="8" maxlength="9">
      <label>Ramal:</label>
      <input type="text" size="4" maxlength="4"><br><br>

      <label>E-mail:</label>
      <input type="email" name="email">
    </fieldset>

    <br>

    <!-- INFORMAÇÕES DE MATRÍCULA -->
    <fieldset>
      <legend>Informações de Matrícula:</legend>

      <label>Série:</label>
      <select name="serie">
        <option value="pre-escolar">pré-escolar</option>
        <option value="1ano">1º ano</option>
        <option value="2ano">2º ano</option>
        <option value="3ano">3º ano</option>
      </select>
      <br><br>

      <label>Turno:</label><br>
      <input type="radio" name="turno" value="manha"> Manhã
      <input type="radio" name="turno" value="tarde"> Tarde
      <br><br>

      <label>Atividades Extracurriculares:</label><br>
      <input type="checkbox" name="informatica"> Informática<br>
      <input type="checkbox" name="musica"> Música<br>
      <input type="checkbox" name="balet"> Balet<br>
      <input type="checkbox" name="pintura"> Pintura<br>
      <input type="checkbox" name="judo"> Judô<br>
      <input type="checkbox" name="futebol"> Futebol<br>
    </fieldset>

    <br>

    <input type="submit" value="Enviar Formulário">
    <input type="reset" value="Limpar Campos">
  </form>
</body>
</html>
